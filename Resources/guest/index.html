<style>
:root{--bg:#f7f6f3;--card:#fff;--text:#1d1c1a;--sub:#6b6862;--faint:#9a968f;--line:rgba(29,28,26,.1);--user:#f1ebe6;--userline:rgba(217,119,87,.28);--accent:#d97757;--code:#f2f1ee;--ok:#2f9e5b;--warn:#c4682f}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1d1b;--text:#ecebe8;--sub:#a9a59e;--faint:#77736c;--line:rgba(236,235,232,.12);--user:#2a2420;--userline:rgba(217,119,87,.35);--code:#262523;--ok:#4cc27a;--warn:#e08b55}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--text);text-decoration:none;flex:none}
.brand img{width:20px;height:20px}
.readonly{font-size:12px;line-height:16px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--sub);margin-left:auto;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:22px;line-height:30px;margin:0 0 6px;font-weight:600;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--sub);font-size:13px;margin-bottom:20px}
.status{display:inline-flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.busy .dot{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.status.waiting .dot{background:var(--warn)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.status.busy .dot{animation:none}}
.more{color:var(--faint);font-size:13px;text-align:center;margin:0 0 16px}
.msg{margin:0 0 14px;max-width:100%;overflow-wrap:anywhere}
.msg.u{margin-left:auto;max-width:88%;width:fit-content;background:var(--user);border:1px solid var(--userline);border-radius:14px;padding:10px 14px}
.msg.a{padding:2px 0}
.msg .time{display:block;color:var(--faint);font-size:12px;margin-top:4px}
.msg.u .time{text-align:right}
.step{color:var(--sub);font-size:13px;margin:-6px 0 10px;padding-left:14px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step::before{content:"";position:absolute;left:2px;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--faint)}
.note{color:var(--sub);font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 14px;background:var(--card)}
.msg p{margin:0 0 8px}.msg p:last-child{margin-bottom:0}
.msg pre{background:var(--code);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:13px;line-height:1.5;margin:6px 0}
.msg code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.msg :not(pre)>code{background:var(--code);border-radius:5px;padding:1px 5px}
.msg ul,.msg ol{margin:4px 0 8px;padding-left:22px}
.msg h3{font-size:16px;margin:10px 0 6px}
.msg a{color:var(--accent)}
.center{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--sub);gap:8px;padding:0 16px}
.center b{color:var(--text);font-size:17px;font-weight:600}
footer{max-width:760px;margin:0 auto;padding:0 16px 32px;color:var(--faint);font-size:12px;line-height:18px}
footer a{color:var(--sub)}
</style>

</div></header>
<main id="main"><div class="center"><b id="loading">正在载入…</b></div></main>

<script>
(function () {
  "use strict";
  var en = !/^zh/i.test(navigator.language || "");
  var T = en ? {
    loading: "Loading…", ro: "Read only", busy: "Working", waiting: "Waiting for approval", idle: "Idle",
    gone: "This link is no longer available", goneHint: "Sharing was stopped, the link has expired, or the computer is not on this network.",
    bad: "Can't reach the computer", badHint: "This address only works on the same network (Wi-Fi) as the computer that shared it.",
    more: "Earlier messages are not included", until: "Link valid until ", updated: "Updated ",
    foot: "Shared from Kiteline. This address only works on the local network. The content comes straight from the sharer's computer and never passes through any server. Claude Code is a product of Anthropic; Kiteline is an independent third-party tool.",
    title: "Shared session · Kiteline", untitled: "Untitled session",
    page: "Sent a web page", images: function (n) { return "Sent " + n + (n === 1 ? " image" : " images") + " (not included in this share)"; }
  } : {
    loading: "正在载入…", ro: "只读", busy: "进行中", waiting: "等待确认", idle: "空闲",
    gone: "链接已失效", goneHint: "对方已停止分享、链接已过期，或者对方的电脑不在这个网络里。",
    bad: "连不上对方的电脑", badHint: "这个网址只能在和对方电脑同一个网络（Wi-Fi）里打开。",
    more: "更早的消息未包含在内", until: "链接有效至 ", updated: "更新于 ",
    foot: "由 Kiteline 分享。这个网址只在局域网内能打开，内容直接来自对方的电脑，不经过任何服务器。Claude Code 是 Anthropic 的产品，Kiteline 是独立的第三方工具。",
    title: "分享的会话 · Kiteline", untitled: "未命名会话",
    page: "发来网页", images: function (n) { return "发来 " + n + " 张图片（未包含在分享中）"; }
  };
  if (en) document.documentElement.lang = "en";
  document.getElementById("ro").textContent = T.ro;
  document.getElementById("loading").textContent = T.loading;
  document.getElementById("foot").textContent = T.foot;

  var main = document.getElementById("main");
  var id = location.pathname.split("/").filter(Boolean).pop();
  var etag = "", expires = 0, timer = 0, failures = 0;

  function center(title, hint) {
    main.innerHTML = "";
    var box = el("div", "center");
    box.appendChild(el("b", "", title));
    if (hint) box.appendChild(el("span", "", hint));
    main.appendChild(box);
  }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function when(ms) {
    var d = new Date(ms), now = new Date();
    var opts = d.toDateString() === now.toDateString() ? { hour: "2-digit", minute: "2-digit" } : { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" };
    return d.toLocaleString(en ? "en-US" : "zh-CN", opts);
  }

  // 只认几样常见写法（代码块、行内代码、粗体、标题、列表、链接）；先整段转义，不会把内容当成网页执行
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s;
  }
  function markdown(text) {
    var out = [], lines = text.replace(/\r/g, "").split("\n"), i = 0, para = [], list = null;
    function flush() {
      if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; }
      if (list) { out.push("<" + list.tag + ">" + list.items.map(function (x) { return "<li>" + inline(x) + "</li>"; }).join("") + "</" + list.tag + ">"); list = null; }
    }
    while (i < lines.length) {
      var line = lines[i];
      if (/^```/.test(line)) {
        flush();
        var code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
        out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
        i++;
        continue;
      }
      var head = /^#{1,6}\s+(.*)$/.exec(line), bullet = /^\s*[-*]\s+(.*)$/.exec(line), num = /^\s*\d+[.)]\s+(.*)$/.exec(line);
      if (head) { flush(); out.push("<h3>" + inline(head[1]) + "</h3>"); }
      else if (bullet || num) {
        if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; }
        var tag = bullet ? "ul" : "ol";
        if (!list || list.tag !== tag) { if (list) flush(); list = { tag: tag, items: [] }; }
        list.items.push((bullet || num)[1]);
      } else if (!line.trim()) { flush(); }
      else { if (list) flush(); para.push(line); }
      i++;
    }
    flush();
    return out.join("");
  }

  function render(snap) {
    document.title = (snap.title || T.untitled) + " · Kiteline";
    var atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
    var first = !main.querySelector("h1");
    main.innerHTML = "";
    main.appendChild(el("h1", "", snap.title || T.untitled));
    var meta = el("div", "meta");
    var status = el("span", "status " + (snap.status || "idle"));
    status.appendChild(el("span", "dot"));
    status.appendChild(el("span", "", T[snap.status] || T.idle));
    meta.appendChild(status);
    [snap.project, snap.agent].forEach(function (x) { if (x) meta.appendChild(el("span", "", x)); });
    if (snap.updatedAt) meta.appendChild(el("span", "", T.updated + when(snap.updatedAt)));
    if (expires) meta.appendChild(el("span", "", T.until + when(expires * 1000)));
    main.appendChild(meta);
    if (snap.more) main.appendChild(el("p", "more", T.more));
    (snap.items || []).forEach(function (item) {
      var text = item.x || "";
      if (item.r === "u" || item.r === "a") {
        var msg = el("div", "msg " + item.r);
        var body = el("div");
        body.innerHTML = markdown(text);
        msg.appendChild(body);
        if (item.ts && item.r === "u") msg.appendChild(el("span", "time", when(item.ts)));
        main.appendChild(msg);
      } else if (item.r === "s") {
        main.appendChild(el("div", "step", text));
      } else if (item.r === "p") {
        main.appendChild(el("div", "note", T.page + (text ? (en ? ": " + text : "「" + text + "」") : "")));
      } else if (item.r === "i") {
        main.appendChild(el("div", "note", T.images(item.n || 1)));
      }
    });
    if (first || atBottom) window.scrollTo(0, document.body.scrollHeight);
  }

  async function load() {
    try {
      var res = await fetch("/g/api/" + encodeURIComponent(id), { cache: "no-store", headers: etag ? { "If-None-Match": etag } : {} });
      if (res.status === 404) { center(T.gone, T.goneHint); return; }
      if (res.status === 304) { failures = 0; return schedule(); }
      if (!res.ok) throw new Error("HTTP " + res.status);
      var snap = await res.json();
      etag = res.headers.get("ETag") || "";
      expires = Number(res.headers.get("X-Share-Expires") || 0);
      render(snap);
      failures = 0;
    } catch (e) {
      failures++;
      // 连不上电脑：先说明，接着重试（电脑回到这个网络后页面自动出来）
      if (!main.querySelector("h1")) center(T.bad, T.badHint);
    }
    schedule();
  }
  function schedule() {
    clearTimeout(timer);
    // 页面在后台时别一直取：回到前台再接着
    timer = setTimeout(function () { if (!document.hidden) load(); else schedule(); }, failures ? 15000 : 8000);
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { clearTimeout(timer); load(); } });

  if (!id) { center(T.gone, T.goneHint); return; }
  load();
})();
</script>
</body>
